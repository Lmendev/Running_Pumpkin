<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Running Pumpkin</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #14100f;
    color: #e8ded4;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
  #game { line-height: 0; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6); }
  canvas { display: block; }
  p { margin: 0; opacity: 0.65; text-align: center; padding: 0 16px; }
  a { color: #f0a35e; }
</style>
</head>
<body>
  <h1>Running Pumpkin</h1>
  <div id="game"><span id="loading">Loading…</span></div>
  <p>Drag the pumpkin along the path to reach Clare on the left, without touching the obstacles.<br>
     Needs a mouse — <a href="https://github.com/Lmendev/Running_Pumpkin">source on GitHub</a>.</p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  <script src="js/button.js"></script>
  <script src="js/character.js"></script>
  <script src="js/monster.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
